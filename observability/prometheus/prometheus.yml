global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: "api-gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "host.docker.internal:9100"

  - job_name: "user-management"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "host.docker.internal:9102"

  - job_name: "restaurant-management"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "host.docker.internal:9101"

  - job_name: "order-management"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "host.docker.internal:9103"

  - job_name: "delivery-management"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "host.docker.internal:9104"

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"