    show-sql: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000
          usermanagement:
            connectTimeout: 2000
            readTimeout: 3000
          restaurantmanagement:
            connectTimeout: 2000
            readTimeout: 3000
server:
  port: 8003
security:
  jwt:
    secret-key: 513c344489bd5120c94654dd155a26b506918a8591e7309371ecae2d699e0d2c
eureka:
