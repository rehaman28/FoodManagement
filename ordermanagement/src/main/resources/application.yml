spring:
  application:
    name: ordermanagement
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: 'jdbc:mysql://localhost:3306/orderdb?createDatabaseIfNotExist=true'
    username: root
    password: Immu@28
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        alphanumeric-ids:
          enabled: true
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000
          usermanagement:
            connectTimeout: 2000
            readTimeout: 3000
          restaurantmanagement:
            connectTimeout: 2000
            readTimeout: 3000
    loadbalancer:
      clients:
        restaurantmanagement:
          retry:
            enabled: true
            max-retries-on-next-service-instance: 0
            max-retries-on-same-service-instance: 1
            retry-on-all-exceptions: false
            retry-on-all-operations: false
        usermanagement:
          retry:
            enabled: true
            max-retries-on-next-service-instance: 0
            max-retries-on-same-service-instance: 1
            retry-on-all-exceptions: false
            retry-on-all-operations: false
resilience4j:
  circuitbreaker:
    instances:
      userManagement:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:
          - com.om.exception.UserNotFoundException
      restaurantManagement:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:
          - com.om.exception.RestaurantNotFoundException
          - com.om.exception.ItemNotFoundException
logging:
  level:
    "[org.springframework.cloud.loadbalancer]": DEBUG
    "[org.springframework.cloud.openfeign]": DEBUG
server:
  port: 8003
security:
  jwt:
    secret-key: 513c344489bd5120c94654dd155a26b506918a8591e7309371ecae2d699e0d2c
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: "${spring.application.name}:${server.port}"
management:
  server:
    port: 9103
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: "never"
  metrics:
    tags:
      application: "${spring.application.name}"
      environment: "local"
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  
