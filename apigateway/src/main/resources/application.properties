spring.application.name=api-gateway
server.port=8080
# --------------------------------------------------
# Eureka
# --------------------------------------------------

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.instance-id=${spring.application.name}:${server.port}

# --------------------------------------------------
# Actuator
# --------------------------------------------------

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ==================================================
# USER MANAGEMENT
# ==================================================

spring.cloud.gateway.server.webmvc.routes[0].id=user-management
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://usermanagement
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**,/users/**


# ==================================================
# RESTAURANT MANAGEMENT
# ==================================================

spring.cloud.gateway.server.webmvc.routes[1].id=restaurant-management
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://restaurantmanagement
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/restaurants/**


# ==================================================
# ORDER MANAGEMENT
# ==================================================

spring.cloud.gateway.server.webmvc.routes[2].id=order-management
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://ordermanagement
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/orders/**


# ==================================================
# DELIVERY MANAGEMENT
# ==================================================

spring.cloud.gateway.server.webmvc.routes[3].id=delivery-management
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://deliverymanagement
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/delivery-person/**,/delivery-assignments/**

